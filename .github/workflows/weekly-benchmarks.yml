name: Weekly Benchmarks

on:
  schedule:
    - cron: '0 9 * * 1'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run benchmarks
        run: |
          python3 - << 'PYEOF'
          import sqlite3, time, hashlib, json, os
          from pathlib import Path

          DB = Path('/tmp/bench.db')
          conn = sqlite3.connect(str(DB))
          conn.execute('PRAGMA journal_mode=WAL')
          conn.execute('''CREATE VIRTUAL TABLE IF NOT EXISTS m
            USING fts5(id, content, category, importance)''')

          # Benchmark: 1000 saves
          start = time.perf_counter()
          for i in range(1000):
              uid = hashlib.md5(str(i).encode()).hexdigest()[:12]
              conn.execute('INSERT INTO m VALUES (?,?,?,?)',
                (uid, f'Memory entry number {i} for benchmark test', 'bench', '5'))
          conn.commit()
          save_ms = (time.perf_counter() - start) * 1000

          # Benchmark: 100 FTS5 searches
          start = time.perf_counter()
          for i in range(100):
              list(conn.execute("SELECT * FROM m WHERE m MATCH 'benchmark' LIMIT 8"))
          search_ms = (time.perf_counter() - start) * 1000

          conn.close()

          import datetime
          now = datetime.datetime.utcnow().strftime('%Y-%m-%d')

          content = f"""# Benchmarks

          > Last updated: {now} (auto-generated by GitHub Actions)

          ## Performance on `ubuntu-latest` / Python 3.12

          | Operation | Count | Total | Per-op |
          |:----------|------:|------:|-------:|
          | Save (FTS5 insert) | 1,000 | {save_ms:.1f}ms | {save_ms/1000:.3f}ms |
          | Search (FTS5 MATCH) | 100 | {search_ms:.1f}ms | {search_ms/100:.3f}ms |

          ## What this means

          - **Save latency:** {save_ms/1000:.3f}ms per memory write — negligible for any agentic workflow
          - **Search latency:** {search_ms/100:.3f}ms per query — faster than any network round-trip
          - **Zero API cost:** $0 per operation (local SQLite, no embeddings)

          *These benchmarks run automatically every Monday via GitHub Actions.*
          """
          
          import textwrap
          with open('BENCHMARKS.md', 'w') as f:
              f.write(textwrap.dedent(content).strip())

          print(f'Save: {save_ms:.1f}ms total | Search: {search_ms:.1f}ms total')
          PYEOF

      - name: Commit benchmark results
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: 'chore: update weekly benchmarks'
          file_pattern: 'BENCHMARKS.md'
