name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.8", "3.10", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Smoke test — server imports cleanly
        run: python3 -c "import server; print('server.py OK')"

      - name: Bootstrap DB (server.py creates ~/engram-mcp/memory.db on first run)
        run: |
          python3 -c "
          import server
          server.init_db()
          print('DB initialised at', server.DB_PATH)
          "

      - name: CLI — save a memory
        run: python3 engram.py save "CI test memory from GitHub Actions" --category ci --importance 5

      - name: CLI — search memories
        run: python3 engram.py search "CI test"

      - name: CLI — list memories
        run: python3 engram.py list

      - name: CLI — stats
        run: python3 engram.py stats

      - name: Verify zero third-party dependencies
        run: |
          python3 -c "
          import ast, sys
          with open('server.py') as f:
              tree = ast.parse(f.read())
          stdlib = {'json','sqlite3','hashlib','sys','os','pathlib','datetime','threading','time','logging'}
          for node in ast.walk(tree):
              if isinstance(node, (ast.Import, ast.ImportFrom)):
                  names = [n.name for n in getattr(node, 'names', [])]
                  mod = getattr(node, 'module', '') or ''
                  for name in names + ([mod] if mod else []):
                      top = name.split('.')[0]
                      if top and top not in stdlib and top not in sys.stdlib_module_names:
                          print(f'FAIL: unexpected import: {top}')
                          sys.exit(1)
          print('PASS: zero third-party dependencies confirmed')
          "
